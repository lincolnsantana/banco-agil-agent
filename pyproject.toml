[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "banco-agil"
version = "0.1.0"
description = "Atendimento bancario conversacional com especialistas internos"
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.16,<4",
    "httpx>=0.27,<1",
    "langchain-core>=0.3,<2",
    "langchain-groq>=0.2,<2",
    "langgraph>=0.2,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "streamlit>=1.39,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "respx>=0.21,<1",
    "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["banco_agil"]

[tool.coverage.report]
show_missing = true
skip_covered = true
